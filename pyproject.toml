[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phx-class-registry"
version = "5.2.2"
description = "Factory+Registry pattern for Python classes"
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
requires-python = ">=3.12"
readme = "README.rst"
license = "MIT"
keywords = [
    "design pattern",
    "factory pattern",
    "registry pattern",
    "service registry",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-extensions>=4.6,<5 ; python_version < '3.13'",
]

[project.urls]
Repository = "https://github.com/todofixthis/class-registry"
Documentation = "https://class-registry.readthedocs.io/"
Changelog = "https://github.com/todofixthis/class-registry/releases"
Issues = "https://github.com/todofixthis/class-registry/issues"

[dependency-groups]
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-mypy>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    # >=3.29 fixes an OSError on Docker/macOS volume mounts (fcntl file locking)
    "filelock>=3.29",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "pyyaml>=6.0.3,<7.0.0",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox>=4,<5",
    "tox-uv>=1,<2",
    "types-pyyaml>=6.0.12.20260518,<7.0.0.0",
]
ci = [
    "mypy>=2,<3",
    "pytest>=9,<10",
    "pyyaml>=6.0.3,<7.0.0",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox-uv>=1,<2",
]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "adr_index",
    "autohooks.plugins.black",
    "autohooks.plugins.mypy",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/class_registry",
    "LICENCE.txt",
    "docs",
    "test",
]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel]
include = ["src/class_registry"]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel.sources]
"src/class_registry" = "class_registry"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.tox]
env_list = ["py314", "py313", "py312"]

[tool.tox.env_run_base]
commands = [
    ["pytest"],
    ["mypy", "src", "test"]
]
runner = "uv-venv-lock-runner"

[tool.uv]
keyring-provider = "subprocess"
# Fix SSL errors when running in Leash containers
system-certs = true
